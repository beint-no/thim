<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{home.title(${version})}">Thim</title>
</head>
<body>
    <main>
        <h1 th:text="#{home.title(${version})}">Thim</h1>
        <p th:text="${greeting}">Greeting</p>
        <ul>
            <li th:each="feature : ${features}">
                <th:block th:replace="~{fragments/feature :: feature(${feature})}"></th:block>
                <a href="/feature/example" th:href="@{/feature/{name}(name=${feature.name},ref='home')}" th:text="#{home.details}">Details</a>
            </li>
        </ul>
        <p th:if="${showFooter}">
            <a href="/health" th:href="@{/health}" th:text="#{home.health}">Health</a>
            <button hx-post="/feedback" th:text="#{home.feedback}">Feedback</button>
        </p>
    </main>
</body>
</html>
