<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{home.title(${version})}">Thim</title>
</head>
<body>
    <main>
        <h1 th:text="#{home.title(${version})}">Thim</h1>
        <p th:text="${greeting}">Greeting</p>
        <ul>
            <li th:each="feature : ${features}">
                <th:block th:replace="~{fragments/feature :: feature(${feature})}"></th:block>
                <a href="/feature/example" th:href="@{/feature/{name}(name=${feature.name},ref='home')}" th:text="#{home.details}">Details</a>
            </li>
        </ul>
        <p th:if="${showFooter}">
            <a href="/health" th:href="@{/health}" th:text="#{home.health}">Health</a>
            <button hx-post="/feedback" th:text="#{home.feedback}">Feedback</button>
        </p>
        <form th:action="@{/feedback}" method="post" th:object="${feedbackForm}">
            <label for="author" th:text="#{home.author}">Author</label>
            <input type="text" th:field="*{author}">
            <span th:errors="*{author}"></span>
            <textarea th:field="*{message}"></textarea>
            <input type="number" th:field="*{rating}">
            <input type="checkbox" th:field="*{subscribe}">
            <input type="radio" th:field="*{priority}" value="normal">
            <input type="radio" th:field="*{priority}" value="high">
            <select th:field="*{category}">
                <option value="general">General</option>
                <option value="bug">Bug</option>
                <option value="idea">Idea</option>
            </select>
            <button type="submit" th:text="#{home.send}">Send</button>
        </form>
    </main>
</body>
</html>
