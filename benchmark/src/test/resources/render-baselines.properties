# Maximum allowed median nanoseconds per operation after warmup.
# These are ceilings, not targets. Local medians on a quiet JDK 26 laptop were
# roughly: inbox 2us, catalog/50 5us, catalog/1 200ns, plain 170ns,
# html.escape 3us, html.raw 90ns. Leave about 50x slack for CI noise.
# Tighten after a real improvement; do not chase machine noise.
inbox.en=100000
inbox.nb=100000
catalog.50=300000
catalog.1=20000
plain=20000
html.escape=150000
html.ascii=100000
html.unicode=80000
html.integer=80000
html.raw=15000
catalog.scale.max=80
