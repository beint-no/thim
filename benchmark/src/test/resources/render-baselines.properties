# Maximum allowed median nanoseconds per operation after warmup.
# These are ceilings, not targets. Local JMH on JDK 26 after the HtmlOutput
# rewrite was roughly: inbox 1.0us, catalog/50 3.7us, ascii 0.66us,
# integers 0.43us, unicode 0.61us. Leave slack for CI noise.
inbox.en=50000
inbox.nb=50000
catalog.50=150000
catalog.1=15000
plain=15000
html.escape=80000
html.ascii=50000
html.unicode=40000
html.integer=40000
html.raw=10000
catalog.scale.max=80
