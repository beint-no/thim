name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: maven-central-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
      - uses: gradle/actions/setup-gradle@v5
      - name: Check release version
        run: |
          version="$(./gradlew -q printReleaseVersion)"
          tag_version="${GITHUB_REF_NAME#v}"
          [[ "$tag_version" == "$version" ]] || {
            echo "Tag version $tag_version does not match Gradle version $version" >&2
            exit 1
          }
          [[ "$version" != *-SNAPSHOT ]] || exit 1
          echo "Publishing version $version"
      - name: Build and publish
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew clean build publishAndReleaseToMavenCentral
