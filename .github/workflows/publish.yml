name: Publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
      registry:
        description: Package registry
        required: true
        default: central
        type: choice
        options:
          - central
          - github

permissions:
  contents: read
  packages: write

concurrency:
  group: thim-release-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '27'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true
      - name: Check release version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")" ]] || exit 1
          version="$(./gradlew -q printReleaseVersion)"
          tag_version="${RELEASE_TAG#v}"
          [[ "$tag_version" == "$version" ]] || {
            echo "Tag version $tag_version does not match Gradle version $version" >&2
            exit 1
          }
          [[ "$version" != *-SNAPSHOT ]] || exit 1
          echo "Publishing version $version"
      - name: Build and publish
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY: ${{ inputs.registry || 'central' }}
        run: |
          case "$REGISTRY" in
            central) ./gradlew clean build publishAndReleaseToMavenCentral ;;
            github) ./gradlew clean build publishAllPublicationsToGitHubPackagesRepository ;;
            *) exit 1 ;;
          esac
