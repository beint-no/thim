name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew clean build
      - run: ./gradlew :runtime:check :compiler:check :spring:check :gradle-plugin:check :example:classes :benchmark:classes --isolated-projects
