org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
ksp.project.isolation.enabled=true

# Also written into the Gradle plugin, which runs the standalone compiler with these versions.
kotlinVersion=2.5.0-Beta2
kspVersion=2.3.12

# Kotlin 2.4 has no JVM 27 bytecode target yet, so Kotlin stays on 26 while Java compiles for 27.
kotlin.jvm.target.validation.mode=warning
